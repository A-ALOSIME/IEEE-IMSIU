name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run db:local
      - name: Integration test
        run: |
          npm run dev > /tmp/ieee-dev.log 2>&1 &
          pid=$!
          trap 'kill $pid || true; cat /tmp/ieee-dev.log' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4321/ >/dev/null && break; sleep 1; done
          npm run test:integration
          npm run test:browser
